name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shiftlink
          POSTGRES_USER: shiftlink
          POSTGRES_PASSWORD: shiftlink_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiftlink -d shiftlink"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: shiftlink
      POSTGRES_USER: shiftlink
      POSTGRES_PASSWORD: shiftlink_ci_password
      JWT_SECRET: shiftlink_ci_secret_for_automated_tests_2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dar permisos al Maven Wrapper
        run: chmod +x mvnw
        working-directory: backend

      - name: Ejecutar tests del backend
        run: ./mvnw test
        working-directory: backend

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: frontend

      - name: Ejecutar lint
        run: npm run lint
        working-directory: frontend

      - name: Compilar frontend
        run: npm run build
        working-directory: frontend
