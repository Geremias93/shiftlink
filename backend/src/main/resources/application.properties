spring.application.name=ShiftLinkBackend

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=60

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Public isolated demo sessions
app.demo.ttl-hours=${DEMO_TTL_HOURS:4}
app.demo.max-active-sessions=${DEMO_MAX_ACTIVE_SESSIONS:50}
app.demo.max-sessions-per-window=${DEMO_MAX_SESSIONS_PER_WINDOW:10}
app.demo.rate-window-minutes=${DEMO_RATE_WINDOW_MINUTES:10}
